<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Pro - Elegant Noir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: 'Inter', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .grid-cell {
            aspect-ratio: 1/1; background: #111111; border: 1px solid #222222;
            border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .grid-cell:active { transform: scale(0.92); background: #1a1a1a; }
        .gem { width: 45%; height: 45%; background: #ffffff; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 15px rgba(255,255,255,0.5); }
        .mine { width: 40%; height: 40%; background: #ff3333; border-radius: 50%; box-shadow: 0 0 10px #ff3333; }
        .hidden-screen { display: none !important; }
        
        #notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 300px; background: #ffffff; color: #000000; padding: 12px; border-radius: 4px;
            text-align: center; font-weight: 600; z-index: 9999; transition: top 0.4s ease;
        }
        #notification.show { top: 20px; }

        /* Uduş Animasiyası */
        #win-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10001; backdrop-filter: blur(5px);
        }
        .win-box {
            background: #ffffff; color: #000000; padding: 30px 50px; border-radius: 8px;
            text-align: center; animation: winPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes winPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .btn-primary { background: #ffffff; color: #000000; transition: opacity 0.2s; }
        .btn-primary:active { opacity: 0.8; }
        .btn-outline { border: 1px solid #333333; color: #999999; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="notification">Mesaj</div>

    <div id="win-overlay" onclick="closeWin()">
        <div class="win-box">
            <h2 class="text-xs uppercase tracking-[0.3em] mb-2 font-light">Təbriklər</h2>
            <div id="win-amount" class="text-4xl font-bold mb-4">0.00 AZN</div>
            <p class="text-[10px] uppercase tracking-widest opacity-60">Davam etmək üçün toxun</p>
        </div>
    </div>

    <div id="login-screen" class="w-full max-w-xs p-8 bg-[#0a0a0a] border border-[#1a1a1a] rounded-lg text-center">
        <h2 class="text-lg font-light mb-8 tracking-[0.4em] uppercase">Maliyyə</h2>
        <input id="access-code" type="text" placeholder="Giriş Kodu" class="w-full bg-transparent p-4 rounded-none border-b border-[#333333] outline-none mb-6 text-center text-white tracking-widest">
        <button onclick="checkCode()" class="w-full btn-primary py-4 rounded-sm font-bold uppercase tracking-widest text-xs">Təsdiqlə</button>
        <button id="go-to-game" onclick="toggleScreens()" class="hidden w-full mt-4 btn-outline py-3 rounded-sm font-bold uppercase tracking-widest text-[10px]">Oyuna Qayıt</button>
    </div>

    <div id="game-screen" class="hidden-screen w-full max-w-xs flex flex-col items-center p-4">
        <div class="w-full bg-[#0a0a0a] p-5 border border-[#1a1a1a] mb-6">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[9px] text-gray-500 uppercase tracking-[0.2em]">Aktiv Balans</span> 
                <span id="penalty-timer" class="text-white font-mono text-[9px] opacity-40"></span>
            </div>
            <div class="flex justify-between items-end">
                <span id="balans-val" class="text-2xl font-light tracking-tight">0.00 AZN</span>
                <div class="flex gap-3">
                    <button onclick="toggleScreens()" class="text-[9px] uppercase tracking-widest border-b border-white/20 pb-1">Artır +</button>
                    <button onclick="showNotify('Telegram idarəçi ilə əlaqə saxlayın', 'blue', 3000)" class="text-[9px] uppercase tracking-widest border-b border-white/20 pb-1 opacity-50">Çıxarış</button>
                </div>
            </div>
        </div>

        <div id="board" class="grid grid-cols-5 gap-2 w-full mb-8"></div>

        <div class="w-full space-y-4">
            <div class="flex justify-between text-[10px] uppercase tracking-widest text-gray-500 px-1">
                <span>Mərc</span>
                <span id="mult-val">x0.00</span>
            </div>
            <input id="bet-input" type="number" step="0.1" value="0.4" class="w-full bg-[#111111] p-4 border border-[#222222] outline-none text-center font-mono">
            <select id="bomb-count" class="w-full bg-[#111111] p-4 border border-[#222222] outline-none text-[10px] uppercase tracking-widest text-center">
                <option value="3">3 Bomba</option>
                <option value="5">5 Bomba</option>
                <option value="10">10 Bomba</option>
            </select>
            <button id="action-btn" onclick="handleAction()" class="w-full btn-primary py-5 rounded-none font-bold text-xs uppercase tracking-[0.3em]">Mərc Et</button>
        </div>
    </div>

    <script>
        let balance = parseFloat(localStorage.getItem('mines_balance')) || 0;
        let usedCodes = JSON.parse(localStorage.getItem('mines_used_codes')) || [];
        let lastSeen = localStorage.getItem('mines_last_seen');
        let isGameActive = false;
        let bombs = [];
        let revealed = 0;
        let currentBet = 0;
        const LIMIT_MS = (12 * 60 * 60 * 1000) + (10 * 1000); // 12 saat 10 saniyə

        const codes3AZN = ["020374", "097896", "768152", "992441", "456073", "223985", "717245", "678993"];
        const codes5AZN = ["050485", "789402", "745629", "234719", "274916", "691047", "729273", "464936", "294744", "6792745", "7582913"];
        const codes7AZN = ["7828375", "6383947", "8374946", "3892846", "7296389", "2920374", "1002356", "1021375", "7388392"];

        window.onload = () => {
            checkPenalty();
            updateUI();
            if (balance > 0) document.getElementById('go-to-game').classList.remove('hidden');
            setInterval(updatePenaltyUI, 1000);
            initBoard();
        };

        function save() {
            localStorage.setItem('mines_balance', balance.toFixed(2));
            localStorage.setItem('mines_used_codes', JSON.stringify(usedCodes));
            localStorage.setItem('mines_last_seen', Date.now());
        }

        function checkPenalty() {
            if (lastSeen && balance > 0) {
                let diff = Date.now() - lastSeen;
                if (diff > LIMIT_MS) {
                    balance -= (balance * 0.10); // 10% cərimə
                    showNotify("12 saatlıq fasilə: -10% cərimə tətbiq edildi", "red", 5000);
                }
            }
            localStorage.setItem('mines_last_seen', Date.now());
            lastSeen = Date.now();
        }

        function updatePenaltyUI() {
            if (!lastSeen || balance <= 0) return;
            let remaining = LIMIT_MS - (Date.now() - lastSeen);
            if (remaining > 0) {
                let h = Math.floor(remaining / 3600000);
                let m = Math.floor((remaining % 3600000) / 60000);
                let s = Math.floor((remaining % 60000) / 1000);
                document.getElementById('penalty-timer').innerText = `${h}:${m}:${s}`;
            } else { checkPenalty(); updateUI(); }
        }

        function showNotify(text, type, duration) {
            const n = document.getElementById('notification');
            n.innerText = text; n.style.background = (type==='red') ? "#ff3333" : "#ffffff";
            n.style.color = (type==='red') ? "#ffffff" : "#000000";
            n.classList.add('show'); setTimeout(() => n.classList.remove('show'), duration);
        }

        function checkCode() {
            const input = document.getElementById('access-code');
            const code = input.value.trim();
            if (usedCodes.includes(code)) return showNotify("Kod istifadə edilib", "red", 2000);
            
            let amount = (code === "2025202620272win") ? 100 : 
                         (codes3AZN.includes(code)) ? 3 : 
                         (codes5AZN.includes(code)) ? 5 : 
                         (codes7AZN.includes(code)) ? 7 : 0;

            if (amount > 0) {
                balance += amount; usedCodes.push(code);
                save(); updateUI();
                document.getElementById('go-to-game').classList.remove('hidden');
                showNotify(`+${amount} AZN Əlavə Edildi`, "green", 3000);
                input.value = "";
            } else { showNotify("Yanlış Kod", "red", 2000); }
        }

        function toggleScreens() {
            document.getElementById('login-screen').classList.toggle('hidden-screen');
            document.getElementById('game-screen').classList.toggle('hidden-screen');
        }

        function initBoard() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const c = document.createElement('div');
                c.className = 'grid-cell'; c.onclick = () => tap(i);
                b.appendChild(c);
            }
        }

        function start() {
            currentBet = parseFloat(document.getElementById('bet-input').value);
            if (currentBet < 0.4 || currentBet > balance) return showNotify("Mərc xətası", "red", 2000);
            balance -= currentBet; save();
            isGameActive = true; revealed = 0; bombs = [];
            let count = parseInt(document.getElementById('bomb-count').value);
            while(bombs.length < count) {
                let r = Math.floor(Math.random() * 25);
                if(!bombs.includes(r)) bombs.push(r);
            }
            updateUI(); initBoard();
            const btn = document.getElementById('action-btn');
            btn.innerText = "Cashout (0.00)"; btn.style.background = "#1a1a1a"; btn.style.color = "#ffffff";
        }

        function calcMult(rev) {
            if (rev === 0) return 0;
            if (rev === 1) return 0.872;
            if (rev === 2) return 0.925;
            if (rev === 3) return 0.988;
            if (rev === 4) return 1.052;
            return 1.052 + (rev - 4) * 0.15;
        }

        function tap(idx) {
            if (!isGameActive) return;
            const cells = document.querySelectorAll('.grid-cell');
            if (cells[idx].innerHTML !== "") return;

            if (bombs.includes(idx)) {
                cells[idx].innerHTML = '<div class="mine"></div>';
                endGame(false);
            } else {
                cells[idx].innerHTML = '<div class="gem"></div>';
                revealed++;
                let m = calcMult(revealed);
                document.getElementById('mult-val').innerText = `x${m.toFixed(3)}`;
                document.getElementById('action-btn').innerText = `Cashout (${(currentBet * m).toFixed(2)})`;
            }
        }

        function handleAction() { if (!isGameActive) start(); else cashout(); }

        function cashout() {
            let winAmt = currentBet * calcMult(revealed);
            balance += winAmt; save();
            document.getElementById('win-amount').innerText = winAmt.toFixed(2) + " AZN";
            document.getElementById('win-overlay').style.display = 'flex';
            endGame(true);
        }

        function closeWin() { document.getElementById('win-overlay').style.display = 'none'; }

        function endGame(win) {
            isGameActive = false;
            const cells = document.querySelectorAll('.grid-cell');
            bombs.forEach(p => { if(cells[p].innerHTML==="") cells[p].innerHTML='<div class="mine" style="opacity:0.3"></div>'});
            document.getElementById('action-btn').innerText = "Mərc Et";
            document.getElementById('action-btn').className = "w-full btn-primary py-5 rounded-none font-bold text-xs uppercase tracking-[0.3em]";
            updateUI();
        }

        function updateUI() {
            document.getElementById('balans-val').innerText = `${balance.toFixed(2)} AZN`;
            document.getElementById('mult-val').innerText = `x0.00`;
        }
    </script>
</body>
</html>
