<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Pro - Updated Multiplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b111b; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .grid-cell {
            aspect-ratio: 1/1; background: #1a2332; border-bottom: 3px solid #0f1621;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: 0.1s;
        }
        .grid-cell:active { transform: translateY(2px); border-bottom-width: 0; }
        .gem { width: 55%; height: 55%; background: #00ffcc; clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 18% 100%, 0% 35%); box-shadow: 0 0 15px #00ffcc; }
        .mine { width: 50%; height: 50%; background: #ff4d4d; border-radius: 50%; position: relative; }
        .hidden-screen { display: none !important; }
        
        #notification {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 320px; color: white;
            padding: 15px; border-radius: 12px; text-align: center; font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 9999;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification.show { top: 20px; }
        .bg-red { background: #ef4444; }
        .bg-green { background: #22c55e; }
        .bg-blue { background: #3b82f6; }

        #withdraw-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10000;
        }
        .modal-content { background: #161d2a; padding: 25px; border-radius: 20px; border: 1px solid #1e293b; text-align: center; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="notification">Mesaj</div>

    <div id="withdraw-modal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4 text-blue-400">Pul Çıxarışı</h3>
            <p class="text-gray-300 text-sm leading-relaxed mb-6">
                Hörmətli istifadəçi pul çıxarışı üçün platformanın yaradıcısı ilə telegram kanalımızdan əlaqə saxlayın. Aktiv balansınızın şəklini skrin edib çıxarış etmək istədiyiniz kart nömrəsilə ona göndərin və pulunuz kartınıza yatırılacaq.
            </p>
            <button onclick="closeWithdraw()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase active:scale-95 transition">Anladım</button>
        </div>
    </div>

    <div id="login-screen" class="w-full max-w-xs p-6 bg-[#161d2a] rounded-2xl shadow-2xl border border-gray-800 text-center">
        <h2 class="text-2xl font-bold mb-6 text-blue-400 uppercase tracking-tighter">Maliyyə Paneli</h2>
        <input id="access-code" type="text" placeholder="Kod daxil edin" class="w-full bg-[#0b111b] p-4 rounded-xl border border-gray-700 outline-none mb-4 text-center text-white uppercase">
        <button onclick="checkCode()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase mb-2 active:scale-95 transition">Təsdiqlə</button>
        <button id="go-to-game" onclick="toggleScreens()" class="hidden w-full bg-gray-700 py-3 rounded-xl font-bold uppercase active:scale-95 transition">Oyuna Qayıt</button>
    </div>

    <div id="game-screen" class="hidden-screen w-full max-w-xs flex flex-col items-center">
        <div class="w-full bg-[#161d2a] p-4 rounded-xl border border-gray-800 mb-4">
            <div class="flex justify-between items-center mb-2">
                <p class="text-[10px] text-gray-500 uppercase tracking-widest">Aktiv Balans</p>
                <p id="mult-val" class="text-sm font-bold text-green-400">x0.00</p>
            </div>
            <div class="flex justify-between items-center">
                <p id="balans-val" class="text-xl font-bold text-yellow-500">0.00 AZN</p>
                <div class="flex gap-2">
                    <button onclick="toggleScreens()" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold border border-blue-600/30 uppercase tracking-tighter">Artır +</button>
                    <button onclick="openWithdraw()" class="bg-green-600/20 text-green-400 px-3 py-1 rounded-lg text-[10px] font-bold border border-green-600/30 uppercase tracking-tighter">Çıxarış</button>
                </div>
            </div>
        </div>

        <div id="board" class="grid grid-cols-5 gap-2 w-full bg-[#161d2a] p-3 rounded-2xl mb-6 shadow-inner"></div>

        <div class="w-full space-y-3">
            <div class="relative">
                <input id="bet-input" type="number" step="0.1" value="0.4" class="w-full bg-[#1a2332] p-4 rounded-xl border border-gray-700 outline-none pr-24 text-lg">
                <div class="absolute right-2 top-2 flex gap-1">
                    <button onclick="setBet('min')" class="bg-[#2d384a] px-2 py-2 rounded text-[10px] font-bold text-gray-300">MIN</button>
                    <button onclick="setBet('max')" class="bg-[#2d384a] px-2 py-2 rounded text-[10px] font-bold text-gray-300">MAX</button>
                </div>
            </div>
            <select id="bomb-count" class="w-full bg-[#1a2332] p-4 rounded-xl border border-gray-700 outline-none text-gray-300">
                <option value="3" selected>3 Bomba</option>
                <option value="5">5 Bomba</option>
                <option value="10">10 Bomba</option>
            </select>
            <button id="action-btn" onclick="handleAction()" class="w-full bg-blue-600 py-4 rounded-xl font-extrabold text-lg active:scale-95 transition uppercase tracking-wider">Mərc Et</button>
        </div>
    </div>

    <script>
        // Telegram Setup
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // DATA VƏ YADDAŞDAN OXUMA
        let balance = parseFloat(localStorage.getItem('mines_balance')) || 0;
        let usedCodes = JSON.parse(localStorage.getItem('mines_used_codes')) || [];
        let startTime = localStorage.getItem('mines_start_time');
        
        let isGameActive = false;
        let bombs = [];
        let revealed = 0;
        let currentBet = 0;
        const LIMIT_MS = 5 * 60 * 60 * 1000; 

        // Kodlar
        const codes3AZN = ["020374", "097896", "768152", "992441", "456073", "223985", "717245", "678993"];
        const codes5AZN = ["050485", "789402", "745629", "234719", "274916", "691047", "729273", "464936", "294744", "6792745", "7582913"];
        const codes7AZN = ["7828375", "6383947", "8374946", "3892846", "7296389", "2920374", "1002356", "1021375", "7388392"];

        window.onload = () => {
            updateUI();
            if (balance > 0) document.getElementById('go-to-game').classList.remove('hidden');
            checkExpiry();
        };

        function saveToStorage() {
            localStorage.setItem('mines_balance', balance.toFixed(2));
            localStorage.setItem('mines_used_codes', JSON.stringify(usedCodes));
            if(startTime) localStorage.setItem('mines_start_time', startTime);
        }

        function checkExpiry() {
            if (startTime) {
                let now = Date.now();
                if (now - startTime > LIMIT_MS) {
                    balance = 0;
                    startTime = null;
                    localStorage.removeItem('mines_start_time');
                    saveToStorage();
                    updateUI();
                    showNotify("5 saatlıq vaxt bitdi. Balans sıfırlandı!", "red", 6000);
                } else {
                    setTimeout(checkExpiry, 10000);
                }
            }
        }

        function showNotify(text, type, duration, callback) {
            const notify = document.getElementById('notification');
            notify.innerText = text;
            notify.className = `bg-${type}`;
            notify.classList.add('show');
            setTimeout(() => { 
                notify.classList.remove('show');
                if(callback) setTimeout(callback, 600);
            }, duration);
        }

        function checkCode() {
            const input = document.getElementById('access-code');
            const code = input.value.trim();
            let addedAmount = 0;

            if (usedCodes.includes(code)) { showNotify("Bu kod istifadə edilib!", "red", 3000); return; }

            if (code === "2025202620272win") addedAmount = 100;
            else if (codes3AZN.includes(code)) addedAmount = 3;
            else if (codes5AZN.includes(code)) addedAmount = 5;
            else if (codes7AZN.includes(code)) addedAmount = 7;

            if (addedAmount > 0) {
                balance += addedAmount;
                usedCodes.push(code);
                if(!startTime) startTime = Date.now();
                saveToStorage();
                updateUI();
                input.value = "";
                document.getElementById('go-to-game').classList.remove('hidden');

                showNotify(`Balans +${addedAmount} AZN artırıldı!`, "green", 3000, () => {
                    showNotify("Bu kod 5 saatlıq müddət içində aktivdir.", "blue", 10000);
                });
            } else { showNotify("Yanlış kod daxil edildi!", "red", 3000); }
        }

        function setBet(type) {
            const input = document.getElementById('bet-input');
            if (type === 'min') input.value = 0.4;
            if (type === 'max') input.value = balance.toFixed(2);
        }

        function openWithdraw() { document.getElementById('withdraw-modal').style.display = 'flex'; }
        function closeWithdraw() { document.getElementById('withdraw-modal').style.display = 'none'; }

        function toggleScreens() {
            document.getElementById('login-screen').classList.toggle('hidden-screen');
            document.getElementById('game-screen').classList.toggle('hidden-screen');
            if (!document.getElementById('game-screen').classList.contains('hidden-screen')) initBoard();
        }

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.onclick = () => tap(i);
                board.appendChild(cell);
            }
        }

        function start() {
            currentBet = parseFloat(document.getElementById('bet-input').value);
            if (currentBet < 0.4) return showNotify("Minimum mərc 0.4 AZN-dir!", "red", 3000);
            if (currentBet > balance) return showNotify("Balans yetərsizdir!", "red", 3000);

            balance -= currentBet;
            saveToStorage();
            isGameActive = true; revealed = 0; bombs = [];
            let count = parseInt(document.getElementById('bomb-count').value);
            while(bombs.length < count) {
                let r = Math.floor(Math.random() * 25);
                if(!bombs.includes(r)) bombs.push(r);
            }
            initBoard(); updateUI();
            const btn = document.getElementById('action-btn');
            btn.innerText = "CASHOUT (0.00)";
            btn.className = "w-full bg-green-600 py-4 rounded-xl font-extrabold text-lg active:scale-95 uppercase";
        }

        function tap(idx) {
            if (!isGameActive) return;
            const cells = document.querySelectorAll('.grid-cell');
            if (cells[idx].innerHTML !== "") return;

            if (bombs.includes(idx)) {
                cells[idx].innerHTML = '<div class="mine"></div>';
                cells[idx].style.background = "#451a1a";
                endGame(false);
            } else {
                cells[idx].innerHTML = '<div class="gem"></div>';
                cells[idx].style.background = "#1d3a3a";
                revealed++;
                // Yenilənmiş əmsal: 0.872 + artım
                let m = 0.872 + (revealed - 1) * 0.095;
                document.getElementById('mult-val').innerText = `x${m.toFixed(3)}`;
                document.getElementById('action-btn').innerText = `CASHOUT (${(currentBet * m).toFixed(2)})`;
            }
        }

        function handleAction() { if (!isGameActive) start(); else cashout(); }

        function cashout() {
            let m = 0.872 + (revealed - 1) * 0.095;
            balance += currentBet * m;
            saveToStorage();
            endGame(true);
        }

        function endGame(win) {
            isGameActive = false;
            const cells = document.querySelectorAll('.grid-cell');
            bombs.forEach(pos => { if(cells[pos].innerHTML === "") cells[pos].innerHTML = '<div class="mine"></div>'; });
            document.getElementById('action-btn').innerText = "MƏRC ET";
            document.getElementById('action-btn').className = "w-full bg-blue-600 py-4 rounded-xl font-extrabold text-lg active:scale-95 transition uppercase";
            updateUI();
        }

        function updateUI() {
            document.getElementById('balans-val').innerText = `${parseFloat(balance).toFixed(2)} AZN`;
            document.getElementById('mult-val').innerText = `x0.00`;
        }
    </script>
</body>
</html>
