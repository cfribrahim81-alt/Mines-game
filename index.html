<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mines Pro - Verified Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0b111b; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        .grid-cell {
            aspect-ratio: 1/1; background: #1a2332; border-bottom: 3px solid #0f1621;
            border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
        }
        .grid-cell:active { transform: scale(0.95); }
        .gem { width: 55%; height: 55%; background: #00ffcc; clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 18% 100%, 0% 35%); box-shadow: 0 0 15px #00ffcc; }
        .mine { width: 50%; height: 50%; background: #ff4d4d; border-radius: 50%; box-shadow: 0 0 15px #ff4d4d; }
        .hidden-screen { display: none !important; }
        
        #notification {
            position: fixed; top: -150px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 320px; color: white; padding: 15px; border-radius: 12px;
            text-align: center; font-weight: bold; z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notification.show { top: 20px; }
        .bg-red { background: #ef4444; }
        .bg-green { background: #22c55e; }
        .bg-blue { background: #3b82f6; }

        #withdraw-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="notification">Mesaj</div>

    <div id="withdraw-modal">
        <div class="bg-[#161d2a] p-6 rounded-2xl border border-gray-800 text-center max-w-xs">
            <h3 class="text-xl font-bold mb-4 text-blue-400">Pul Çıxarışı</h3>
            <p class="text-gray-400 text-sm mb-6">Hörmətli istifadəçi, balansınızı çıxarmaq üçün idarəçi ilə Telegram vasitəsilə əlaqə saxlayın.</p>
            <button onclick="closeWithdraw()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase">Anladım</button>
        </div>
    </div>

    <div id="login-screen" class="w-full max-w-xs p-6 bg-[#161d2a] rounded-2xl border border-gray-800 text-center">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">MALIYYƏ PANELI</h2>
        <input id="access-code" type="text" placeholder="Kod daxil edin" class="w-full bg-[#0b111b] p-4 rounded-xl border border-gray-700 outline-none mb-4 text-center uppercase">
        <button onclick="checkCode()" class="w-full bg-blue-600 py-3 rounded-xl font-bold uppercase mb-2">Təsdiqlə</button>
        <button id="go-to-game" onclick="toggleScreens()" class="hidden w-full bg-gray-700 py-3 rounded-xl font-bold uppercase">Oyuna Qayıt</button>
    </div>

    <div id="game-screen" class="hidden-screen w-full max-w-xs flex flex-col items-center p-4">
        <div class="w-full bg-[#161d2a] p-4 rounded-xl border border-gray-800 mb-4">
            <div class="flex justify-between items-center mb-1"><span class="text-[10px] text-gray-500">MULTİPLIER</span> <span id="mult-val" class="text-green-400 font-bold">x0.00</span></div>
            <div class="flex justify-between items-center">
                <span id="balans-val" class="text-xl font-bold text-yellow-500">0.00 AZN</span>
                <div class="flex gap-2">
                    <button onclick="toggleScreens()" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded text-[10px] border border-blue-600/30">ARTIR</button>
                    <button onclick="openWithdraw()" class="bg-green-600/20 text-green-400 px-3 py-1 rounded text-[10px] border border-green-600/30">ÇIXARIŞ</button>
                </div>
            </div>
        </div>

        <div id="board" class="grid grid-cols-5 gap-2 w-full bg-[#161d2a] p-3 rounded-2xl mb-4"></div>

        <div class="w-full space-y-3">
            <div class="relative">
                <input id="bet-input" type="number" step="0.1" value="0.4" class="w-full bg-[#1a2332] p-4 rounded-xl border border-gray-700 outline-none">
                <div class="absolute right-2 top-2 flex gap-1">
                    <button onclick="setBet('min')" class="bg-[#2d384a] p-2 rounded text-[10px]">MIN</button>
                    <button onclick="setBet('max')" class="bg-[#2d384a] p-2 rounded text-[10px]">MAX</button>
                </div>
            </div>
            <select id="bomb-count" class="w-full bg-[#1a2332] p-4 rounded-xl border border-gray-700 outline-none">
                <option value="3" selected>3 BOMBA</option>
                <option value="5">5 BOMBA</option>
                <option value="10">10 BOMBA</option>
            </select>
            <button id="action-btn" onclick="handleAction()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-lg uppercase tracking-widest">Mərc Et</button>
        </div>
    </div>

    <script>
        if(window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let balance = parseFloat(localStorage.getItem('mines_balance')) || 0;
        let usedCodes = JSON.parse(localStorage.getItem('mines_used_codes')) || [];
        let startTime = localStorage.getItem('mines_start_time');
        let isGameActive = false;
        let bombs = [];
        let revealed = 0;
        let currentBet = 0;
        const LIMIT_MS = 5 * 60 * 60 * 1000;

        window.onload = () => {
            updateUI();
            if (balance > 0) document.getElementById('go-to-game').classList.remove('hidden');
            checkExpiry();
        };

        function save() {
            localStorage.setItem('mines_balance', balance.toFixed(2));
            localStorage.setItem('mines_used_codes', JSON.stringify(usedCodes));
            if(startTime) localStorage.setItem('mines_start_time', startTime);
        }

        function checkExpiry() {
            if (startTime && (Date.now() - startTime > LIMIT_MS)) {
                balance = 0; startTime = null; localStorage.removeItem('mines_start_time');
                save(); updateUI(); showNotify("5 saatlıq vaxt bitdi!", "red", 5000);
            } else if(startTime) { setTimeout(checkExpiry, 30000); }
        }

        function showNotify(text, type, duration) {
            const n = document.getElementById('notification');
            n.innerText = text; n.className = `bg-${type}`; n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), duration);
        }

        function checkCode() {
            const input = document.getElementById('access-code');
            const code = input.value.trim();
            if (usedCodes.includes(code)) return showNotify("Kod istifadə edilib!", "red", 2000);

            let amount = 0;
            if (code === "2025202620272win") amount = 100;
            // Digər kodlar bura əlavə oluna bilər

            if (amount > 0) {
                balance += amount; usedCodes.push(code);
                if(!startTime) startTime = Date.now();
                save(); updateUI();
                document.getElementById('go-to-game').classList.remove('hidden');
                showNotify(`Balans +${amount} AZN!`, "green", 3000);
                input.value = "";
            } else { showNotify("Yanlış kod!", "red", 2000); }
        }

        function toggleScreens() {
            document.getElementById('login-screen').classList.toggle('hidden-screen');
            document.getElementById('game-screen').classList.toggle('hidden-screen');
            initBoard();
        }

        function initBoard() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const c = document.createElement('div');
                c.className = 'grid-cell'; c.onclick = () => tap(i);
                b.appendChild(c);
            }
        }

        function start() {
            currentBet = parseFloat(document.getElementById('bet-input').value);
            if (currentBet < 0.4 || currentBet > balance) return showNotify("Limit xətası!", "red", 2000);
            
            balance -= currentBet; save();
            isGameActive = true; revealed = 0; bombs = [];
            let count = parseInt(document.getElementById('bomb-count').value);
            while(bombs.length < count) {
                let r = Math.floor(Math.random() * 25);
                if(!bombs.includes(r)) bombs.push(r);
            }
            updateUI(); initBoard();
            const btn = document.getElementById('action-btn');
            btn.innerText = "CASHOUT (0.00)";
            btn.className = "w-full bg-green-600 py-4 rounded-xl font-bold text-lg uppercase";
        }

        function calcMult(rev) {
            // Sənin istədiyin Hard Mode: Yalnız 4-cü almazdan sonra 1.05x olur
            if (rev === 1) return 0.872;
            if (rev === 2) return 0.925;
            if (rev === 3) return 0.988;
            if (rev === 4) return 1.052; // 4-cü almazda xeyrə keçir
            return 1.052 + (rev - 4) * 0.15;
        }

        function tap(idx) {
            if (!isGameActive) return;
            const cells = document.querySelectorAll('.grid-cell');
            if (cells[idx].innerHTML !== "") return;

            if (bombs.includes(idx)) {
                cells[idx].innerHTML = '<div class="mine"></div>';
                endGame(false);
            } else {
                cells[idx].innerHTML = '<div class="gem"></div>';
                revealed++;
                let m = calcMult(revealed);
                document.getElementById('mult-val').innerText = `x${m.toFixed(3)}`;
                document.getElementById('action-btn').innerText = `CASHOUT (${(currentBet * m).toFixed(2)})`;
            }
        }

        function handleAction() { if (!isGameActive) start(); else cashout(); }

        function cashout() {
            let m = calcMult(revealed);
            balance += currentBet * m; save(); endGame(true);
        }

        function endGame(win) {
            isGameActive = false;
            const cells = document.querySelectorAll('.grid-cell');
            bombs.forEach(p => { if(cells[p].innerHTML==="") cells[p].innerHTML='<div class="mine" style="opacity:0.5"></div>'});
            document.getElementById('action-btn').innerText = "MƏRC ET";
            document.getElementById('action-btn').className = "w-full bg-blue-600 py-4 rounded-xl font-bold text-lg uppercase";
            updateUI();
        }

        function updateUI() {
            document.getElementById('balans-val').innerText = `${balance.toFixed(2)} AZN`;
            document.getElementById('mult-val').innerText = `x0.00`;
        }

        function setBet(t) {
            const i = document.getElementById('bet-input');
            i.value = (t==='min') ? 0.4 : balance.toFixed(2);
        }

        function openWithdraw() { document.getElementById('withdraw-modal').style.display = 'flex'; }
        function closeWithdraw() { document.getElementById('withdraw-modal').style.display = 'none'; }
    </script>
</body>
</html>
